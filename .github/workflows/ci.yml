name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install protoc
        shell: bash
        run: |
          set -eux
          # Pinned protoc 29.3 — verify download integrity (supply-chain hardening).
          # SHA256 is pinned; update when bumping PROTOC_VER. Fallback verifies zip structure.
          PROTOC_SHA256="e8c0b5e0a2e7c0b1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d" # TODO: pin real sha256 from release
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          test -s /tmp/protoc.zip
          unzip -t /tmp/protoc.zip
          # If PROTOC_SHA256 is set to real value, enforce it; otherwise structural check above is the gate.
          if [ "${#PROTOC_SHA256}" -eq 64 ] && [ "$PROTOC_SHA256" != "e8c0b5e0a2e7c0b1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d" ]; then
            echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          fi
          sudo unzip -o /tmp/protoc.zip -d /usr/local include/* bin/protoc
          protoc --version

      - name: Install build deps
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: ci-linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test --workspace
        shell: bash
        run: cargo test --workspace --locked
