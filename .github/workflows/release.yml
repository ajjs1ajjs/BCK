name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install protoc
        shell: bash
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local include/* bin/protoc

      - name: Install build deps
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node (for web UI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Build binaries
        shell: bash
        run: cargo build --release --workspace --bins

      - name: Build web UI
        shell: bash
        run: |
          (cd web-ui && npm ci --silent && npm run build)

      - name: Assemble archive
        shell: bash
        run: |
          mkdir -p staging/bin staging/web-ui
          cp target/release/bckd target/release/bck-agent target/release/bck target/release/bck-proxy staging/bin/
          cp -r web-ui/dist staging/web-ui/
          tar -czf bck-linux-x86_64.tar.gz -C staging .
          sha256sum bck-linux-x86_64.tar.gz > bck-linux-x86_64.tar.gz.sha256
          echo "ARCH=bck-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bck-linux
          path: |
            bck-*.tar.gz
            bck-*.tar.gz.sha256

  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\protoc.zip"
          Expand-Archive "$env:RUNNER_TEMP\protoc.zip" -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\protoc\bin"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node (for web UI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Build binaries
        run: cargo build --release --workspace --bins

      - name: Build web UI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location web-ui
          npm ci --silent
          npm run build
          Pop-Location

      - name: Assemble archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path staging/bin, staging/web-ui -Force | Out-Null
          Copy-Item target/release/bckd.exe, target/release/bck-agent.exe, target/release/bck.exe, target/release/bck-proxy.exe staging/bin/
          Copy-Item web-ui/dist staging/web-ui/dist -Recurse
          Compress-Archive -Path staging/* -DestinationPath bck-windows-x86_64.zip
          (Get-FileHash bck-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + "  bck-windows-x86_64.zip" | Out-File -Encoding ascii bck-windows-x86_64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bck-windows
          path: |
            bck-*.zip
            bck-*.zip.sha256

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Publish release to public distribution repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPO: ajjs1ajjs/BCK
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "PUBLIC_RELEASE_TOKEN is not configured" >&2; exit 1; }
          mapfile -t FILES < <(find artifacts -type f \( -name 'bck-*.tar.gz' -o -name 'bck-*.zip' -o -name 'bck-*.sha256' \) -print)
          test "${#FILES[@]}" -gt 0 || { echo "No release files were produced" >&2; exit 1; }
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$PUBLIC_REPO" \
            --title "BCK $TAG" \
            --generate-notes
