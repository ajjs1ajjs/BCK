name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu x86_64
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libssl-dev libzstd-dev

      # Pinned protoc is the single source of truth (apt protobuf-compiler intentionally omitted).
      - name: Install protoc
        shell: bash
        run: |
          PROTOC_SHA256="3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a"
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          unzip -t /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local include/* bin/protoc
          protoc --version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}-x86_64

      - name: Build release
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo --version
          rustc --version
          cargo build --release --workspace --bins 2>&1 | tail -50
          echo "=== Build complete ==="
          ls -la target/release/ | head -20

      - name: Build web UI
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Package release
        shell: bash
        run: |
          ARTIFACT="bck-linux-x86_64"
          mkdir -p release/bin
          cp target/release/bckd release/bin/
          cp target/release/bck-agent release/bin/
          cp target/release/bck release/bin/
          cp target/release/bck-proxy release/bin/
          mkdir -p release/web-ui
          cp -r web-ui/dist release/web-ui/
          cd release
          tar -czf $ARTIFACT.tar.gz bin web-ui
          sha256sum $ARTIFACT.tar.gz > $ARTIFACT.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bck-linux-x86_64
          path: release/bck-linux-x86_64*
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: bck-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
