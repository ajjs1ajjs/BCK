name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install protoc
        shell: bash
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local include/* bin/protoc

      - name: Install build deps
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node (for web UI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Build binaries
        shell: bash
        run: cargo build --release --workspace --bins

      - name: Build web UI
        shell: bash
        run: |
          (cd web-ui && npm ci --silent && npm run build)

      - name: Assemble archive
        shell: bash
        run: |
          mkdir -p staging/bin staging/web-ui
          cp target/release/bckd target/release/bck-agent target/release/bck target/release/bck-proxy staging/bin/
          cp -r web-ui/dist staging/web-ui/
          tar -czf bck-linux-x86_64.tar.gz -C staging .
          echo "ARCH=bck-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bck-linux
          path: |
            bck-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/**/bck-*.tar.gz
          generate_release_notes: true