name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          profile: minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libssl-dev libzstd-dev protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --workspace --bins

      - name: Build web UI
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Package release
        run: |
          ARTIFACT=bck-linux-x86_64
          mkdir -p release/$ARTIFACT
          cp target/release/bckd release/$ARTIFACT/
          cp target/release/bck-agent release/$ARTIFACT/
          cp target/release/bck release/$ARTIFACT/
          cp target/release/bck-proxy release/$ARTIFACT/
          cp -r web-ui/dist release/$ARTIFACT/web-ui
          cd release
          tar -czf $ARTIFACT.tar.gz $ARTIFACT
          sha256sum $ARTIFACT.tar.gz > $ARTIFACT.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bck-linux-x86_64
          path: release/bck-linux-x86_64.tar.gz*
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bck-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true