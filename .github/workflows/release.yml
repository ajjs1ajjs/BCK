name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          toolchain: 1.98.0
          profile: minimal

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libssl-dev libzstd-dev protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo deny
        # Fail the build on policy violations BEFORE producing a release artifact.
        shell: bash
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: cargo audit
        shell: bash
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build release
        run: cargo build --release --workspace --bins

      - name: Build web UI
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Package release
        run: |
          ARTIFACT=bck-linux-x86_64
          mkdir -p release/bin
          cp target/release/bckd release/bin/
          cp target/release/bck-agent release/bin/
          cp target/release/bck release/bin/
          cp target/release/bck-proxy release/bin/
          mkdir -p release/web-ui
          cp -r web-ui/dist release/web-ui/
          cd release
          tar -czf $ARTIFACT.tar.gz bin web-ui
          sha256sum $ARTIFACT.tar.gz > $ARTIFACT.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@4cec87d30f9789408b5b657daa1a4acd5b4f97749b5d8ed7373b399a59c1b5c6 # v4
        with:
          name: bck-linux-x86_64
          path: release/bck-linux-x86_64.tar.gz*
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts
          pattern: bck-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3cee8d6b2b1ad4db2ce3f3995bce8c4f6b6f5b86 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
