# cargo-audit exceptions for BCK Enterprise Backup Engine
# These vulnerabilities cannot be fixed due to transitive dependency constraints
# and are documented with justifications for security audit compliance.

[ignore]
# RUSTSEC-2026-0275: azure_core 0.21.0 - Authorization header logging
# Justification: azure_storage v0.21.0 and azure_storage_blobs v0.21.0 have hard
# dependencies on azure_core 0.21.0. No newer versions of these crates exist on crates.io.
# Our usage (StorageCredentials::access_key with ContainerClient) does not enable
# debug/trace logging that would expose authorization headers in production logs.
# Risk: LOW - only exploitable if DEBUG/TRACE logging is enabled for azure_core.
"RUSTSEC-2026-0275" = { reason = "transitive dependency constraint - no newer azure_storage/azure_storage_blobs versions available; authorization header logging only at debug level not enabled in production" }

# RUSTSEC-2026-0258: h2 0.3.27 - Unbounded empty DATA frames
# Justification: h2 0.3.27 is a transitive dependency of aws-smithy-http-client v1.4.0
# (AWS SDK for Rust), which is required for AWS S3 integration. The vulnerability
# affects HTTP/2 server implementations; our AWS SDK usage is client-only.
# Risk: LOW - client-side usage not affected by server-side DoS vulnerability.
"RUSTSEC-2026-0258" = { reason = "transitive dependency in aws-smithy-http-client; client-side usage not vulnerable to server DoS" }

# RUSTSEC-2026-0194: quick-xml 0.31.0 - Quadratic runtime duplicate attribute check
# RUSTSEC-2026-0195: quick-xml 0.31.0 - Unbounded namespace-declaration allocation
# Justification: quick-xml 0.31.0 is a transitive dependency of azure_core 0.21.0,
# which is required by azure_storage/azure_storage_blobs (see RUSTSEC-2026-0275).
# We do not parse untrusted XML input in our Azure storage usage.
# Risk: LOW - only exploitable with malicious XML input, which we don't process.
"RUSTSEC-2026-0194" = { reason = "transitive dependency via azure_core 0.21.0; no untrusted XML parsing in Azure storage usage" }
"RUSTSEC-2026-0195" = { reason = "transitive dependency via azure_core 0.21.0; no untrusted XML parsing in Azure storage usage" }

# RUSTSEC-2023-0071: rsa 0.9.10 - Marvin Attack timing sidechannel
# Justification: No fixed upgrade available per advisory. This is a timing sidechannel
# vulnerability in RSA PKCS#1 v1.5 decryption. We use rsa crate only for JWT
# signature verification (via jsonwebtoken with RS256), not for decryption.
# Risk: LOW - verification-only usage not vulnerable to Marvin Attack.
"RUSTSEC-2023-0071" = { reason = "no fixed version available; usage limited to JWT signature verification (not decryption)" }

# RUSTSEC-2026-0098: rustls-webpki 0.101.7 - Name constraints for URI names
# RUSTSEC-2026-0099: rustls-webpki 0.101.7 - Name constraints for wildcard names
# RUSTSEC-2026-0104: rustls-webpki 0.101.7 - Panic in CRL parsing
# Justification: rustls-webpki 0.101.7 is a transitive dependency of rustls 0.21.12,
# which is required by aws-smithy-http-client v1.4.0 (AWS SDK). Our direct rustls
# dependency is 0.23.44 (using rustls-webpki 0.103.15). AWS SDK client-side TLS
# verification not affected by these certificate validation issues.
# Risk: LOW - client-side TLS verification with trusted CA certificates.
"RUSTSEC-2026-0098" = { reason = "transitive dependency in aws-smithy-http-client via rustls 0.21.12; client-side TLS with trusted CAs" }
"RUSTSEC-2026-0099" = { reason = "transitive dependency in aws-smithy-http-client via rustls 0.21.12; client-side TLS with trusted CAs" }
"RUSTSEC-2026-0104" = { reason = "transitive dependency in aws-smithy-http-client via rustls 0.21.12; client-side TLS with trusted CAs" }