[package]
name = "bck-core"
version.workspace = true
edition.workspace = true
description = "BCK Enterprise Backup Engine - Core Library"

[dependencies]
# Async
tokio = { workspace = true }
futures = { workspace = true }
tokio-util = "0.7"
tokio-stream = "0.1"

# Web server (Axum)
axum = { workspace = true, features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace", "compression-gzip", "limit", "request-id"] }
hyper = "1"

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "migrate"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { workspace = true }
serde_json = "1"
bincode = "1"

# Compression
zstd = { version = "0.13", features = ["zdict_builder"] }
lz4 = "1.28"

# Encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Hashing
sha2 = { workspace = true }
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Storage
aws-sdk-s3 = "1"
aws-config = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-types = "1"
azure_storage_blobs = "0.21"
azure_storage = "0.21"
reqwest = { version = "0.12", features = ["stream", "json"] }

# Auth
# jsonwebtoken pinned >=10.3.0: v9.3.1 is affected by CVE-2026-25537 (type
# confusion / authorization bypass via malformed claims).
jsonwebtoken = { version = ">=10.3.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.5"
ldap3 = { version = "0.12.1", default-features = false, features = ["sync", "tls-rustls-ring"] }

# Config
toml = "0.8"
dotenvy = "0.15"

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Scheduling
cron = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
bytes = "1"
notify = { version = "7", features = ["macos_kqueue"] }
parking_lot = "0.12"
dashmap = "6"
async-trait = { workspace = true }
base64 = "0.22"
pem = "3"

# Security overrides for transitive dependencies
azure_core = "0.22.0"
h2 = "0.4.16"
quick-xml = "0.41.0"
ring = "0.17.12"
lru = "0.16.4"

[build-dependencies]
tonic-prost-build = "0.14"

[lib]
name = "bck_core"
path = "src/lib.rs"
