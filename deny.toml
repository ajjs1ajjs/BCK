# cargo-deny policy for BCK Enterprise.
# Run with: cargo deny check

[graph]
all-features = false

[advisories]
yanked = "allow"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "OpenSSL",
  "Zlib",
  "MPL-2.0",
  "Unlicense",
  "0BSD",
  "BlueOak-1.0.0",
]
confidence-threshold = 0.5

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow = []

[sources]
unknown-registry = "allow"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
