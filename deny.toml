# cargo-deny policy for BCK Enterprise.
# Run with: cargo deny check

[graph]
all-features = false

[advisories]
yanked = "allow"
ignore = [
  "RUSTSEC-2026-0275", # azure_core 0.21.0 - transitive dep constraint (azure_storage)
  "RUSTSEC-2026-0258", # h2 0.3.27 - transitive in aws-smithy-http-client
  "RUSTSEC-2026-0194", # quick-xml 0.31.0 - transitive via azure_core
  "RUSTSEC-2026-0195", # quick-xml 0.31.0 - transitive via azure_core
  "RUSTSEC-2023-0071", # rsa 0.9.10 - no fix available
  "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 - transitive in aws-smithy-http-client
  "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 - transitive in aws-smithy-http-client
  "RUSTSEC-2026-0104", # rustls-webpki 0.101.7 - transitive in aws-smithy-http-client
  # Transitive-only, no fix available; none are in our direct attack surface.
  "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained (complete version per authors; direct use is serialization only)
  "RUSTSEC-2026-0174", # http-types 2.12.0 notice via azure_core 0.21.0 (unmaintained Azure SDK dep)
  "RUSTSEC-2024-0384", # instant 0.1.13 unmaintained via azure/http-types chain
  "RUSTSEC-2026-0253", # lru 0.16.4 unsound pop() - needs panicking Drop + catch_unwind; transitive-only, lru unused directly
  "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained (proc-macro, build-time only) via azure chain
  "RUSTSEC-2025-0134", # rustls-pemfile 1.0.4 unmaintained (thin wrapper over rustls-pki-types; TLS cert loading only)
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "OpenSSL",
  "Zlib",
  "MPL-2.0",
  "Unlicense",
  "0BSD",
  "BlueOak-1.0.0",
  "BSL-1.0", # xxhash-rust (Boost Software License, OSI-approved)
]
confidence-threshold = 0.5

[bans]
multiple-versions = "allow"
wildcards = "allow"
allow = []

[sources]
unknown-registry = "allow"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
