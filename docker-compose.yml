version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bck
      POSTGRES_USER: bck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bck"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  bckd:
    build:
      context: .
      dockerfile: Dockerfile
      target: bckd
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # Never hardcode this; provide it via .env or a Docker secret.
      BCK_JWT_SECRET: ${BCK_JWT_SECRET:?Set BCK_JWT_SECRET (openssl rand -hex 32) in .env}
      BCK_AGENT_TOKEN: ${BCK_AGENT_TOKEN:?Set BCK_AGENT_TOKEN in .env}
      RUST_LOG: info
    ports:
      - "9440:9440"
      - "9441:9441"
    volumes:
      - bck_data:/data
    command: [
      "bckd",
      "--config", "/etc/bck/config.toml",
      "--database-url", "postgres://bck:${POSTGRES_PASSWORD}@postgres:5432/bck"
    ]

volumes:
  pgdata:
  minio_data:
  bck_data:
